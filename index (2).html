<title>منيو HEXA Gaming Caffe</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f1;--card:#ffffff;--text:#1a1a1a;--muted:#6b6b6b;--line:#d9d4cc;--accent:#e8561f;--chip:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161616;--card:#212121;--text:#f4f1ee;--muted:#a09a94;--line:#3a3a3a;--accent:#f26a2e;--chip:#262626;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161616;--card:#212121;--text:#f4f1ee;--muted:#a09a94;--line:#3a3a3a;--accent:#f26a2e;--chip:#262626;color-scheme:dark}
html{scroll-padding-top:70px;height:auto}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;line-height:1.5}
header{background:#161616;text-align:center;padding:22px 16px 18px;border-bottom:3px solid var(--accent)}
header img{max-width:260px;width:70%;height:auto;display:block;margin:0 auto}
header p{margin:6px 0 0;color:#cfcac5;font-size:14px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0}
nav .row{display:flex;gap:8px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
nav .row::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;text-decoration:none;color:var(--text);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;white-space:nowrap}
nav a.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:720px;margin:0 auto;padding:14px 14px 40px}
section{margin-top:22px}
h2{margin:0 0 4px;font-size:21px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:8px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.note{margin:0 0 8px;color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.item{display:flex;align-items:baseline;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .n{font-weight:600;font-size:16px}
.item .d{color:var(--muted);font-size:12.5px;display:block;font-weight:400}
.item .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:12px}
.item .p{font-weight:800;font-size:17px;color:var(--text);white-space:nowrap}
.item .p small{font-weight:600;color:var(--muted);font-size:11px;margin-inline-start:3px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 30px}
</style>
</head>
